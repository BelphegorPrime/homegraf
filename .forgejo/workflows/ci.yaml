# CI on Forgejo (the primary repository). Forgejo uses this folder instead of .github/workflows, so the GitHub
# workflows stay as they are for the mirror: they build and publish the images on GitHub. This file only tests.
# Jobs run in containers on the runner labelled `docker`; actions/checkout is replaced by a plain git fetch.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    runs-on: docker
    timeout-minutes: 15
    container:
      image: node:26-bookworm-slim@sha256:5df79989ed685e09f0a98019db4cebfb22fb9df1a53c0161664a011f7ff6b0f1
    defaults:
      run:
        working-directory: app
    steps:
      - name: git
        working-directory: .
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates
      - name: checkout
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q . && git config --global --add safe.directory "$PWD"
          git -c http.extraheader="Authorization: token $TOKEN" fetch -q --no-tags "${{ github.server_url }}/${{ github.repository }}.git" "${{ github.sha }}"
          git checkout -q "${{ github.sha }}"
      - name: forgehands launcher (no Docker, no network)
        working-directory: .
        run: |
          node --check scripts/forgehands-entrypoint.mjs
          node --test scripts/forgehands-entrypoint.test.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  bootstrap:
    runs-on: docker
    timeout-minutes: 10
    strategy:
      matrix:
        # Pull requests take the smaller matrix; main and workflow_dispatch run both versions.
        image: ${{ fromJSON(github.event_name == 'pull_request' && '["python:3.11-slim-bookworm@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39"]' || '["python:3.11-slim-bookworm@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39","python:3.14-slim-bookworm@sha256:3fe1a0b6c2d6b2ebb572906cdabeca75aeb558c0c17db5ffefbcf8094871c32b"]') }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: git
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q . && git config --global --add safe.directory "$PWD"
          git -c http.extraheader="Authorization: token $TOKEN" fetch -q --no-tags "${{ github.server_url }}/${{ github.repository }}.git" "${{ github.sha }}"
          git checkout -q "${{ github.sha }}"
      - name: tests (standard library only)
        working-directory: bootstrap
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v

  seed:
    runs-on: docker
    timeout-minutes: 15
    # The seed check installs its dependencies from PyPI; transient index errors and slow reads
    # failed this job while the app jobs passed. More retries and a longer read timeout keep the
    # check about the seed, not about the network.
    env:
      PIP_RETRIES: "10"
      PIP_TIMEOUT: "120"
    strategy:
      fail-fast: false
      matrix:
        # Pull requests take the smaller matrix; main and workflow_dispatch run both versions.
        image: ${{ fromJSON(github.event_name == 'pull_request' && '["python:3.11-slim-bookworm@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39"]' || '["python:3.11-slim-bookworm@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39","python:3.14-slim-bookworm@sha256:3fe1a0b6c2d6b2ebb572906cdabeca75aeb558c0c17db5ffefbcf8094871c32b"]') }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: git and nginx
        run: |
          # The tests call `nginx -t` with their own config; the service itself must not run. This container has no
          # init, so the policy script stops the package's postinst from starting a daemon here.
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d && chmod +x /usr/sbin/policy-rc.d
          apt-get update -q && apt-get install -y -q --no-install-recommends git nginx
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q . && git config --global --add safe.directory "$PWD"
          git -c http.extraheader="Authorization: token $TOKEN" fetch -q --no-tags "${{ github.server_url }}/${{ github.repository }}.git" "${{ github.sha }}"
          git checkout -q "${{ github.sha }}"
      - name: seed check as an unprivileged user
        # GitHub's runners are unprivileged, this container is root. Running the check as root hides permission
        # problems such as the nginx log path that failed on GitHub from #79 until #116.
        run: |
          # The workspace belongs to root; the unprivileged user gets a copy it can reach.
          cp -a . /tmp/seed-src && chmod -R a+rX /tmp/seed-src
          mkdir -p /tmp/seed-home && chmod 777 /tmp/seed-home
          cd /tmp/seed-src && setpriv --reuid=65534 --regid=65534 --clear-groups env HOME=/tmp/seed-home TMPDIR=/tmp bash scripts/check-seed.sh
