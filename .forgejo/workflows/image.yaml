name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npm run typecheck
      - working-directory: app
        run: npm run lint
      - working-directory: app
        run: npm run format:check
      - working-directory: app
        run: npm test
      - working-directory: app
        run: npm audit --omit=dev --audit-level=high

  image:
    needs: test
    runs-on: docker
    timeout-minutes: 45
    services:
      docker:
        image: docker:29.9.2-dind
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
        env:
          DOCKER_TLS_CERTDIR: ""
    env:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for Docker daemon
        run: |
          for attempt in $(seq 1 30); do
            if docker info --format '{{.ServerVersion}}' | grep -q .; then
              exit 0
            fi
            sleep 2
          done
          echo "Docker daemon did not become ready within 60 seconds" >&2
          exit 1
      - name: Build image
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version=dev
          fi
          docker build --platform linux/amd64 --build-arg APP_VERSION="$version" --tag homegraf:scan .
      - name: Scan loaded image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: homegraf:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
