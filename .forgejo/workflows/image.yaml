name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npm run typecheck
      - working-directory: app
        run: npm run lint
      - working-directory: app
        run: npm run format:check
      - working-directory: app
        run: npm test
      - working-directory: app
        run: npm audit --omit=dev --audit-level=high

  image:
    needs: test
    runs-on: docker
    # The build took about 40 minutes in DinD (2 minutes on a workstation); 90 leaves room for scan and publish on main.
    timeout-minutes: 90
    services:
      docker:
        image: docker:29.9.2-dind
        options: >-
          --privileged
          --tmpfs /var/lib/docker:rw,exec,size=16g
          --health-cmd "docker info"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
        env:
          DOCKER_TLS_CERTDIR: ""
    env:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Docker CLI, Buildx, and Trivy
        shell: bash
        run: |
          bin="$RUNNER_TEMP/image-tools"
          mkdir -p "$bin" "$HOME/.docker/cli-plugins"
          cd "$bin"
          curl -fsSLo docker.tgz https://download.docker.com/linux/static/stable/x86_64/docker-29.9.2.tgz
          curl -fsSLo docker-buildx https://github.com/docker/buildx/releases/download/v0.39.1/buildx-v0.39.1.linux-amd64
          curl -fsSLo trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          sha256sum --check <<'EOF'
          9ac225999fd5e863f7694c728ef23d480616b1e5639328fa309befd4243d69eb  docker.tgz
          903090816da68f8bc1a2ff5346dd163a5adacfce4548d003c75df42cd47a9bf4  docker-buildx
          bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  trivy.tgz
          EOF
          tar -xzf docker.tgz --strip-components=1 docker/docker
          install docker-buildx "$HOME/.docker/cli-plugins/docker-buildx"
          tar -xzf trivy.tgz trivy
          echo "$bin" >> "$GITHUB_PATH"
      - name: Wait for Docker daemon
        run: |
          for attempt in $(seq 1 30); do
            if version=$(timeout 2s docker info --format '{{.ServerVersion}}') && [ -n "$version" ]; then
              printf 'DinD server version: %s\n' "$version"
              # /var/lib/docker is a tmpfs (service options), so overlay2 works; vfs here would copy every layer and be very slow.
              printf 'DinD storage driver: %s\n' "$(docker info --format '{{.Driver}}')"
              exit 0
            fi
            sleep 2
          done
          echo "Docker daemon did not become ready within 30 attempts" >&2
          exit 1
      - name: Check live registry TLS
        run: test "$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://git.szb.marcel.codes/v2/)" = 401
      - name: Resolve image version and tags
        id: metadata
        shell: bash
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
        run: |
          version=dev
          tags=
          number='(0|[1-9][0-9]*)'
          release="^refs/tags/v($number\.$number)\.$number$"
          if [ "$EVENT" = push ]; then
            if [ "$REF" = refs/heads/main ]; then
              tags="main sha-${COMMIT:0:7}"
            elif [[ "$REF" =~ $release ]]; then
              version="${REF#refs/tags/}"
              tags="${version#v} ${BASH_REMATCH[1]} latest"
            fi
          fi
          printf 'version=%s\ntags=%s\n' "$version" "$tags" >> "$GITHUB_OUTPUT"
      - name: Build image
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          docker buildx build --load --platform linux/amd64 --file app/Dockerfile \
            --build-arg APP_VERSION="$VERSION" --build-arg APT_REFRESH="$(date -u +%Y-%m-%d)" --label "org.opencontainers.image.version=$VERSION" \
            --tag homegraf:scan .
          loaded_version=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' homegraf:scan)
          test "$loaded_version" = "$VERSION"
          printf 'Loaded image version: %s\n' "$loaded_version"
      # No actions/cache for the Trivy DB: restoring and saving it took over 4 minutes each, the download itself 13 seconds.
      - name: Download Trivy DB
        shell: bash
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
        run: |
          # The DB is public: an empty Docker config keeps registry credentials out of the download.
          export DOCKER_CONFIG="$RUNNER_TEMP/trivy-docker-config"
          mkdir -p "$DOCKER_CONFIG"
          for attempt in 1 2 3; do
            if trivy image --download-db-only; then
              exit 0
            fi
            printf 'Trivy DB download attempt %s failed\n' "$attempt" >&2
            sleep $((attempt * 20))
          done
          # Diagnostics: what the runner gets from both sources.
          curl -sS -o /dev/null -w 'mirror.gcr.io manifest: %{http_code}\n' \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            https://mirror.gcr.io/v2/aquasec/trivy-db/manifests/2 || true
          curl -sS -o /dev/null -w 'ghcr.io token: %{http_code}\n' \
            'https://ghcr.io/token?scope=repository:aquasecurity/trivy-db:pull&service=ghcr.io' || true
          if [ -f "$TRIVY_CACHE_DIR/db/trivy.db" ]; then
            echo "::warning::Trivy DB download failed; scanning with the cached DB"
            exit 0
          fi
          echo "Trivy DB download failed and no cached DB exists" >&2
          exit 1
      - name: Scan loaded image
        id: scan
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          trivy image --image-src docker --scanners vuln --pkg-types os,library --skip-db-update \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 homegraf:scan
      - name: Smoke-test loaded image
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          app="homegraf-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          browser="$app-browser"
          trap 'timeout 15s docker rm -f -v "$browser" "$app" >/dev/null 2>&1 || true' EXIT
          timeout 30s docker run -d --name "$app" --network none homegraf:scan
          browser_image=mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
          timeout 300s docker pull "$browser_image"
          timeout 60s docker run --rm --name "$browser" --network "container:$app" -i \
            "$browser_image" bash -euo pipefail -s -- "$VERSION" <<'EOF'
          base=http://127.0.0.1:8080
          for attempt in $(seq 1 15); do
            if health=$(curl -fsS --max-time 1 "$base/api/health") && [ "$health" = '{"ok":true}' ]; then
              break
            fi
            if [ "$attempt" = 15 ]; then
              echo 'Homegraf health check failed' >&2
              exit 1
            fi
            sleep 1
          done
          # Chromium executes the served bundle; a label or a bundle string alone cannot prove what React renders.
          chrome=(/ms-playwright/chromium-*/chrome-linux64/chrome)
          dom=$("${chrome[0]}" --headless --no-sandbox --disable-dev-shm-usage \
            --virtual-time-budget=5000 --dump-dom "$base/" 2>/tmp/chromium.log) || { cat /tmp/chromium.log >&2; exit 1; }
          if ! grep -Fq "homegraf <span class=\"text-xs font-normal text-muted-foreground\">$1</span>" <<< "$dom"; then
            printf 'Login page did not render expected app version: %s\n' "$1" >&2
            exit 1
          fi
          printf 'Rendered app version: %s\n' "$1"
          EOF
      - name: Set up publish builder
        if: success() && steps.scan.outcome == 'success' && github.event_name == 'push' && steps.metadata.outputs.tags != ''
        run: |
          # A container builder for provenance and SBOM attestations; amd64 only, so no QEMU emulation is set up.
          docker buildx create --name publish --driver docker-container \
            --driver-opt image=docker.io/moby/buildkit@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e
          docker buildx inspect publish --bootstrap
      - name: Login to Forgejo registry
        if: success() && steps.scan.outcome == 'success' && github.event_name == 'push' && steps.metadata.outputs.tags != ''
        env:
          REGISTRY_USER: ${{ vars.PACKAGES_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          # Run 3689 job 4898 logged in successfully but the Forgejo job token was
          # rejected with HTTP 401 at blob upload, so publication uses a scoped
          # package token (write:package) provided by the operator.
          if [ -z "${REGISTRY_USER:-}" ] || [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "Missing scoped Forgejo package credentials: set vars.PACKAGES_USERNAME and secrets.PACKAGES_TOKEN" >&2
            exit 1
          fi
          printf '%s' "$REGISTRY_TOKEN" | docker login git.szb.marcel.codes --username "$REGISTRY_USER" --password-stdin
      - name: Publish amd64 image
        if: success() && steps.scan.outcome == 'success' && github.event_name == 'push' && steps.metadata.outputs.tags != ''
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          trap 'docker logout git.szb.marcel.codes' EXIT
          image=git.szb.marcel.codes/marcel/homegraf
          read -r -a aliases <<< "$TAGS"
          args=()
          for tag in "${aliases[@]}"; do
            args+=(--tag "$image:$tag")
          done
          metadata="$RUNNER_TEMP/published-image.json"
          # amd64 only: an emulated arm64 build on the runner took the job past its 45-minute limit on every push to
          # main. The GitHub workflow publishes the multi-platform image to ghcr.io.
          docker buildx build --builder publish --push --platform linux/amd64 \
            --file app/Dockerfile --build-arg APP_VERSION="$VERSION" --build-arg APT_REFRESH="$(date -u +%Y-%m-%d)" \
            --label "org.opencontainers.image.version=$VERSION" --provenance=mode=max --sbom=true \
            --metadata-file "$metadata" "${args[@]}" .
          digest=$(node -e 'const d = require(process.argv[1])["containerimage.digest"]; if (!d) process.exit(1); console.log(d)' "$metadata")
          for tag in "${aliases[@]}"; do
            printf 'Published %s at %s\n' "$image:$tag" "$digest"
          done
