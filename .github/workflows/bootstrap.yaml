# Tests the bootstrap of the stack (bootstrap/), builds its container image, scans it and publishes it to the GitHub Container Registry.
#   pull request           tests, builds and scans; nothing is published
#   push to main           also publishes ghcr.io/<owner>/homegraf-bootstrap:main and :sha-<commit>
#   tag v1.2.3             publishes :1.2.3, :1.2 and :latest
# The image contains the seed (seed/) when the repository has one, else a stub: see bootstrap/Dockerfile.
name: bootstrap

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - bootstrap/**
      - seed/**
      - .dockerignore
      - .github/workflows/bootstrap.yaml
  pull_request:
    paths:
      - bootstrap/**
      - seed/**
      - .dockerignore
      - .github/workflows/bootstrap.yaml
  workflow_dispatch:

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.11", "3.x"]        # the oldest Python the tools support and the newest
    defaults:
      run:
        working-directory: bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Standard library only: nothing to install.
      - run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-bootstrap" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=homegraf-bootstrap
            org.opencontainers.image.description=One-shot configuration of the homegraf stack (Forgejo, Komodo, Nginx Proxy Manager, Infisical, AdGuard Home)

      # The build context is the repository root (the image may contain seed/); .dockerignore keeps it to what the image needs.
      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: bootstrap/Dockerfile
          platforms: linux/amd64
          load: true
          tags: homegraf-bootstrap:scan
          cache-from: type=gha,scope=bootstrap
          cache-to: type=gha,scope=bootstrap,mode=max

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: homegraf-bootstrap:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Publish for amd64 and arm64
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: bootstrap/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=bootstrap
          cache-to: type=gha,scope=bootstrap,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
