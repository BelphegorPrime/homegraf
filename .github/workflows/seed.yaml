# Proves that seed/ works as the repository of a new installation: scripts/check-seed.sh copies it to an empty directory, fills the
# placeholders with sample values and runs the tools and their tests there, on the oldest and a recent Python.
name: seed

on:
  push:
    branches: [main]
    paths:
      - seed/**
      - scripts/check-seed.sh
      - .github/workflows/seed.yaml
  pull_request:
    paths:
      - seed/**
      - scripts/check-seed.sh
      - .github/workflows/seed.yaml
  workflow_dispatch:

concurrency:
  group: seed-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: scripts/check-seed.sh
