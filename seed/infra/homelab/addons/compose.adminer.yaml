# Building block of ./homelab.py new-app --addon adminer: a web UI for the PostgreSQL or MariaDB block. It logs in with
# the database's own user and password (the secrets in Infisical). Published on a free LAN port, like the other
# LAN-only tools. __APP__ is the app ID, __DB__ the database block it opens by default, __PORT__ the LAN port.
x-addon:
  label: Adminer
  description: Web UI for the database. Open it on the LAN port shown after choosing it and log in with the database user and password.
  ui: true
  requires_any: [postgres, mariadb]
  secrets: []
services:
  adminer:
    image: adminer:6.2.0
    restart: unless-stopped
    ports:
      - "__PORT__:8080"
    environment:
      ADMINER_DEFAULT_SERVER: __DB__
    depends_on:
      __DB__:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
