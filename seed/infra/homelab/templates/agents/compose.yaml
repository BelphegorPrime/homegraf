# Template of ./homelab.py new-app --template agents, see templates.py for the keys of x-template. Renovate keeps the images current.
x-template:
  label: AI agents
  category: ai
  description: >-
    ForgeHands starts an OpenHands Agent Canvas conversation for a Forgejo issue label (planner, worker, worker-strong, reviewer) and the
    agent opens a draft pull request. Both run in this one stack, so ForgeHands reaches Canvas over the compose network.
  health_path: /healthz
  statuses: [200]
  routes:
    - service: openhands
      host: openhands
      port: 8000
      health_path: /health
      websockets: true
      statuses: [200]
  first_run: >-
    Open the OpenHands host of this app (the second address in the summary), create the administrator and add a model provider key
    there; it stays in the volume, not in the repository. The automated path to the profiles and their routes is the homegraf bootstrap
    (python -m hgboot run), once #58 connects the factory reconcilers to that run. Opt in with FORGEHANDS_BOOTSTRAP=1 and give it,
    in .env, FORGEHANDS_OPENHANDS_API_URL (http://openhands:8000), OPENHANDS_LOCAL_BACKEND_API_KEY, FORGEHANDS_STRONG_MODEL,
    FORGEHANDS_CHEAP_MODEL, FORGEHANDS_GATEWAY_URL, FORGEHANDS_GATEWAY_API_KEY, FORGEHANDS_ALLOWED_REPOS,
    FORGEHANDS_ALLOWED_SENDERS, FORGEHANDS_AGENT_LOGIN, FORGEHANDS_HUMAN_LOGIN, FORGEHANDS_FORGEJO_AGENT_TOKEN (FORGEJO_TOKEN is the
    fallback), FORGEHANDS_FORGEJO_WEBHOOK_SECRET and FORGEHANDS_MERGE_POLICY. It reconciles the LLM and agent profiles and their ids,
    the repository labels and the webhook, and publishes LABEL_ROUTES from the ids. Until #58 lands that run creates none of it, and
    this template opts nothing in: a stack that no bootstrap ran for has no profiles and therefore no routes, so create the agent
    profiles yourself in Canvas and keep LABEL_ROUTES empty.
    ForgeHands starts in webhook mode: register the OpenHands automation webhook as docs/stack.md says. Direct mode is opt-in: set
    OPENHANDS_API_URL to http://openhands:8000 and LABEL_ROUTES to the label -> profile routes, with the profile ids from
    GET /api/agent-profiles (a name is rejected). The routes cover the issue labels ai:plan, ai:ready, ai:escalate and
    ai:review, and on the pull request of an agent issue "on": "pull_request" (ai:changes), "on": "ci_failure",
    "on": "ci_success", "on": "epic_done" and "on": "conflict". Empty profile ids keep direct mode off.
    Tiers, the security review route and the worker routes' fallback and escalation are set by the bootstrap's LABEL_ROUTES
    (follow-up tickets), not by this template; the per-tier weekly budget is gone, so MAX_RUNS_PER_HOUR and a route's
    max_budget steer cost.
    In both modes the Forgejo webhook (events: issues, pull_request_label, action_run_failure, action_run_success, push;
    secret FORGEJO_WEBHOOK_SECRET) is required. Put a Forgejo token with write:repository and read:user into FORGEJO_TOKEN and set
    ALLOWED_REPOS to the owner/repository pairs the agents may work on (comma separated).
services:
  app:
    image: ghcr.io/belphegorprime/forgehands:v0.4.2
    ports:
      - "8080:8080"
    volumes:
      - /srv/docker/app/data:/app/data
    environment:
      # Webhook mode by default. Direct mode: this service's URL plus LABEL_ROUTES with the profile ids from GET /api/agent-profiles.
      OPENHANDS_API_URL: ""
      OPENHANDS_API_KEY: ${LOCAL_BACKEND_API_KEY}
      # Direct mode only: the variables handed to every conversation, and Forgejo as the agent reaches it.
      AGENT_SECRETS: FORGEJO_TOKEN,FORGEJO_URL
      FORGEJO_URL: http://forgejo:3000
      FORGEJO_TOKEN: ${FORGEJO_TOKEN}
      # Label -> profile id, tier and limits; a role name is rejected as a profile id. Empty keeps direct mode off;
      # first_run names every route kind direct mode covers.
      LABEL_ROUTES: ""
      ALLOWED_REPOS: owner/repository
      # The agent user, and the human ForgeHands mentions when a pull request needs one; both must be senders,
      # or ForgeHands ignores the events the agents themselves cause. Neither token is a field here: the agent's
      # Forgejo token is the ${FORGEJO_TOKEN} secret above, the human keeps his own outside the stack.
      ALLOWED_SENDERS: operator,openhands
      FORGEHANDS_AGENT_LOGIN: openhands
      HUMAN_LOGIN: operator
      MAX_CONCURRENT_PER_TIER: "2"
      MAX_CONCURRENT: "4"
      MAX_RUNS_PER_HOUR: "30"
      MAX_RUN_MINUTES: "120"
      MAX_ROUNDS: "3"
      # The labels of a round and a review, the epic labels, and whether a moved default branch brings open pull
      # requests up to date (a conflict then starts the "on": "conflict" round).
      BLOCKED_LABEL: ai:blocked
      APPROVED_LABEL: ai:approved
      EPIC_LABEL: ai:plan,ai:close
      UPDATE_BRANCHES: "1"
      BRANCH_UPDATE_DELAY_SECONDS: "60"
      BRANCH_UPDATE_MIN_INTERVAL_MINUTES: "30"
      MIN_REVIEW_CHARS: "300"
      # Per repository merge policy in ForgeHands' own environment, not a file of the repository (the pull request
      # it restrains could change that file). A repository without an entry is never merged automatically. Replace
      # the key with each repository in ALLOWED_REPOS; * matches within a folder, ** across folders.
      MERGE_POLICY: '{"owner/repository": {"deny": [".forgejo/**", ".github/**", "AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md", ".agents/**", ".claude/**", "compose.yaml", "**/compose.yaml", "setup.sh", "scripts/**", "infra/**", "stacks/**"]}}'
      MERGE_METHOD: merge
      # A worker ticket that ran out of iterations or time goes to the planner with this label.
      SPLIT_LABEL: ai:plan
      # Days before ForgeHands reminds HUMAN_LOGIN of a pull request that waits for him.
      REMIND_AFTER_DAYS: "2"
      # Restarts of a run that ended in error; 0 switches it off.
      ERROR_RETRIES: "1"
      # Out of quota: hold a tier back at most this many hours at a time.
      QUOTA_HOLD_MAX_HOURS: "8"
      # Out of quota: give a job up once its quota has been out this many hours.
      QUOTA_GIVE_UP_HOURS: "24"
      # An approval label without a verdict comment is looked at once more after this many seconds.
      APPROVAL_GRACE_SECONDS: "90"
      # JSON repository -> weight for sharing starts across repositories, for example {"owner/repository": 2}.
      REPO_WEIGHTS: ""
      # Bearer token for /status, /status.json and /metrics (at least 16 characters). Never a value here.
      STATUS_TOKEN: ${STATUS_TOKEN}
      # The strong and cheap LLM profiles the factory creates in Canvas (bootstrap/hgboot/factory_config.py);
      # its key comes from Infisical like every other secret.
      FORGEHANDS_STRONG_MODEL: vendor/strong-model
      FORGEHANDS_CHEAP_MODEL: vendor/cheap-model
      FORGEHANDS_GATEWAY_URL: https://llm.example/v1
      FORGEHANDS_GATEWAY_API_KEY: ${FORGEHANDS_GATEWAY_API_KEY}
      WORKSPACE_DIR: /app/data/workspace
      JOBS_FILE: /app/data/jobs.json
      # Webhook mode only: the secrets Forgejo and Canvas sign with, and the URL Canvas hands out.
      FORGEJO_WEBHOOK_SECRET: ${FORGEJO_WEBHOOK_SECRET}
      OPENHANDS_WEBHOOK_SECRET: ${OPENHANDS_WEBHOOK_SECRET}
      OPENHANDS_WEBHOOK_URL: ${OPENHANDS_WEBHOOK_URL}
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
  openhands:
    # The all-in-one Agent Canvas image (Canvas, Agent Server and Automation Server), main on 2026-11-14.
    image: ghcr.io/openhands/agent-canvas@sha256:360eb652ef69577d013326b2505d6bd04cbfeac257fc259e6012ae904f2270bb
    ports:
      - "8000:8000"
    volumes:
      - /srv/docker/__APP__/openhands:/root/.openhands
      - /srv/docker/__APP__/projects:/projects
    environment:
      LOCAL_BACKEND_API_KEY: ${LOCAL_BACKEND_API_KEY}
      OH_SECRET_KEY: ${OH_SECRET_KEY}
      # The webhook URL Canvas hands out: the service appends /api/automation itself, and ForgeHands reaches it by name.
      AUTOMATION_BASE_URL: http://openhands:8000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
