# Template of ./homelab.py new-app --template agents, see templates.py for the keys of x-template. Renovate keeps the images current.
x-template:
  label: AI agents
  category: ai
  description: >-
    ForgeHands starts an OpenHands Agent Canvas conversation for a Forgejo issue label (planner, worker, worker-strong, reviewer) and the
    agent opens a draft pull request. Both run in this one stack, so ForgeHands reaches Canvas over the compose network.
  health_path: /healthz
  statuses: [200]
  routes:
    - service: openhands
      host: openhands
      port: 8000
      health_path: /health
      websockets: true
      statuses: [200]
  first_run: >-
    Open the OpenHands host of this app (the second address in the summary), create the administrator and add a model provider key
    there; it stays in the volume, not in the repository. Create the agent profiles planner, worker, worker-strong and reviewer.
    ForgeHands starts in webhook mode: register the OpenHands automation webhook as docs/stack.md says. Direct mode is opt-in: set
    OPENHANDS_API_URL to http://openhands:8000 and LABEL_ROUTES to the label -> profile routes, with the profile ids from
    GET /api/agent-profiles (a name is rejected). In both modes the Forgejo webhook (events: issues, secret FORGEJO_WEBHOOK_SECRET) is
    required. Put a Forgejo token with write:repository and read:user into FORGEJO_TOKEN and set ALLOWED_REPOS to the owner/repository
    pairs the agents may work on (comma separated).
services:
  app:
    image: ghcr.io/belphegorprime/forgehands:v0.2.11
    ports:
      - "8080:8080"
    volumes:
      - /srv/docker/app/data:/app/data
    environment:
      # Webhook mode by default. Direct mode: this service's URL plus LABEL_ROUTES with the profile ids from GET /api/agent-profiles.
      OPENHANDS_API_URL: ""
      OPENHANDS_API_KEY: ${LOCAL_BACKEND_API_KEY}
      # Direct mode only: the variables handed to every conversation, and Forgejo as the agent reaches it.
      AGENT_SECRETS: FORGEJO_TOKEN,FORGEJO_URL
      FORGEJO_URL: http://forgejo:3000
      FORGEJO_TOKEN: ${FORGEJO_TOKEN}
      # Label -> profile id, tier, max_iterations (optional max_budget, max_concurrent). Empty keeps direct mode off.
      LABEL_ROUTES: ""
      ALLOWED_REPOS: owner/repository
      ALLOWED_SENDERS: owner
      MAX_CONCURRENT_PER_TIER: "2"
      MAX_CONCURRENT: "4"
      MAX_RUNS_PER_HOUR: "30"
      MAX_RUN_MINUTES: "120"
      WORKSPACE_DIR: /app/data/workspace
      JOBS_FILE: /app/data/jobs.json
      # Webhook mode only: the secrets Forgejo and Canvas sign with, and the URL Canvas hands out.
      FORGEJO_WEBHOOK_SECRET: ${FORGEJO_WEBHOOK_SECRET}
      OPENHANDS_WEBHOOK_SECRET: ${OPENHANDS_WEBHOOK_SECRET}
      OPENHANDS_WEBHOOK_URL: ${OPENHANDS_WEBHOOK_URL}
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
  openhands:
    # The all-in-one Agent Canvas image (Canvas, Agent Server and Automation Server), main on 2026-11-14.
    image: ghcr.io/openhands/agent-canvas@sha256:360eb652ef69577d013326b2505d6bd04cbfeac257fc259e6012ae904f2270bb
    ports:
      - "8000:8000"
    volumes:
      - /srv/docker/__APP__/openhands:/root/.openhands
      - /srv/docker/__APP__/projects:/projects
    environment:
      LOCAL_BACKEND_API_KEY: ${LOCAL_BACKEND_API_KEY}
      OH_SECRET_KEY: ${OH_SECRET_KEY}
      # The webhook URL Canvas hands out: the service appends /api/automation itself, and ForgeHands reaches it by name.
      AUTOMATION_BASE_URL: http://openhands:8000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
