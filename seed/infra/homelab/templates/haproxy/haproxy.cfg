# HAProxy: HTTP in front of your servers. Out of the box the backend answers itself, so you can see it works;
# put your servers in the backend (the example lines) and remove the "http-request return" line.
global
    log stdout format raw local0
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend web
    bind :80
    # By host name, to several backends:
    # acl is_wiki hdr(host) -i wiki.lab.example
    # use_backend wiki if is_wiki
    default_backend app

backend app
    # balance roundrobin
    # server app1 10.0.0.50:8080 check
    # server app2 10.0.0.51:8080 check
    http-request return status 200 content-type text/plain string "haproxy is running - edit haproxy.cfg"
