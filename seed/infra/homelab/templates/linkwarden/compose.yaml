# Template of ./homelab.py new-app --template linkwarden, see templates.py for the keys of x-template. Renovate keeps the image current.
x-template:
  label: Linkwarden
  category: productivity
  description: "Bookmark manager that archives pages as screenshots and PDFs, with full-text search (PostgreSQL and Meilisearch)."
  addons: [postgres, meilisearch]
  health_path: /
  statuses: [200, 302, 307]
  first_run: Open __URL__ and register your account. To close sign-up afterwards set NEXT_PUBLIC_DISABLE_REGISTRATION to true.
services:
  app:
    image: ghcr.io/linkwarden/linkwarden:v2.16.3
    ports:
      - "3000:3000"
    volumes:
      - /srv/docker/app/data:/data/data
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@postgres:5432/app
      NEXTAUTH_URL: __URL__/api/v1/auth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
