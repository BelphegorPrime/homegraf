version = 1

; Settings for every model; a section [model-name] below overrides them for one model.
[*]
jinja = true
flash-attn = on
parallel = 1

; A quantized KV cache saves VRAM
cache-type-k = q8_0
cache-type-v = q8_0

; Spread the model between GPU and system memory, keeping 2 GiB of VRAM free
fit = on
fit-target = 2048

stop-timeout = 10
