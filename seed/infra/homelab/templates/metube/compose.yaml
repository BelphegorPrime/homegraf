# Template of ./homelab.py new-app --template metube, see templates.py for the keys of x-template. Renovate keeps the image current.
x-template:
  label: MeTube
  category: media
  description: "Web page for yt-dlp: paste a video or playlist link and the file lands in the downloads folder."
  health_path: /
  websockets: true
  statuses: [200, 302]
  first_run: Open __URL__ and paste a link. The files are in /srv/docker/__APP__/downloads on the server; change the volume to put them elsewhere.
services:
  app:
    image: ghcr.io/alexta69/metube:2026.11.01
    ports:
      - "8081:8081"
    volumes:
      - /srv/docker/app/downloads:/downloads
