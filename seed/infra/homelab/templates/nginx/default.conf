# nginx: the default server. Static site from html/ (a folder of this repository, delivered with every pull).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Reverse proxy instead of the static site: remove the location above and use this one.
    # location / {
    #     proxy_pass http://10.0.0.50:8080;
