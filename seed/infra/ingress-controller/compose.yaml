# Komodo stack "ingressctl" on the management server (inventory/ingress.yaml: controller.management_server).
# Like every stack: files_on_host in the Komodo repo clone infrastructure-<server>; ../.. is the root of that clone.
# Does not run permanently. Deploy builds the image from the checked-out state and runs `status` once.
# Komodo starts mutating runs via RunStackService (procedures ingress-apply and ingress-renew).
# Credentials come from infra/secrets/*.env in the checkout (in the repo at the operator's request).
name: ingressctl
services:
  ingressctl:
    build:
      context: .
    image: ingressctl:local
    restart: "no"
    working_dir: /repo
    entrypoint:
      - /bin/sh
      - -c
      - . /repo/infra/secrets/npm.env && . /repo/infra/secrets/ingressctl.env && exec ingressctl "$$@"
      - ingressctl
    command: ["status"]
    environment:
      INGRESSCTL_STATE_DIR: /var/lib/ingressctl
    volumes:
      - ../..:/repo:ro                                    # checkout (Komodo repo clone)
      - state:/var/lib/ingressctl   # SQLite state, locks, pending keys (back them up!); permissions from the image (uid 10001)

  # Stage 1 of ingress-apply: stacks that exist only as a folder with ingress.yaml get their secrets, Komodo stack and
  # first deploy (infra/komodo/reconcile_stacks.py). Same image; needs infra/secrets/provisioner.env.
  reconcile:
    image: ingressctl:local
    profiles: [reconcile]   # not started by DeployStack, only by RunStackService
    restart: "no"
    working_dir: /repo
    entrypoint:
      - /bin/sh
      - -c
      - '[ -f /repo/infra/secrets/provisioner.env ] || { echo "no infra/secrets/provisioner.env (infra/infisical/provisioner.py --apply): reconcile skipped"; exit 0; }; . /repo/infra/secrets/provisioner.env && exec python /repo/infra/komodo/reconcile_stacks.py "$$@"'
      - reconcile
    command: ["--apply"]
    environment:
      HOMELAB_ROOT: /repo
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../..:/repo:ro

volumes:
  state:
    name: ingressctl-state
